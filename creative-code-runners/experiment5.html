<!DOCTYPE html>
<html lang="en">
<head>
	<title>experiment5 runner</title>
	<base href="https://corvuscorae.github.io/creativecoding/experiment5/" />
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<style>
		:root {
			--background: #0c0b10;
			--surface: #15131b;
			--surface-raised: #1d1a25;
			--text: #f6f2ee;
			--muted: #aaa4b1;
			--line: #37313f;
			--lime: #b6ff38;

			--panel-width: 320px;
			--evolution-frame-size: 420px;
			--evolution-image-size: 360PX;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			overflow: hidden;
			background: var(--background);
			color: var(--text);
			font-family: Arial, Helvetica, sans-serif;
		}

		button,
		input,
		select {
			font: inherit;
		}

		button,
		select {
			border: 1px solid var(--line);
			border-radius: 0.7rem;
			color: var(--text);
			background: var(--surface-raised);
		}

		button {
			padding: 0.55rem 0.8rem;
			cursor: pointer;
		}

		button:hover,
		button:focus-visible,
		select:focus-visible,
		input:focus-visible {
			border-color: var(--lime);
			outline: none;
		}

		select {
			width: 100%;
			padding: 0.5rem 0.65rem;
		}

		input[type="range"] {
			width: 100%;
			accent-color: var(--lime);
		}

		input[type="checkbox"] {
			accent-color: var(--lime);
		}

		.runner-shell {
			display: grid;
			grid-template-columns: minmax(0, 1fr) var(--panel-width);
			width: 100vw;
			height: 100vh;
			overflow: hidden;
		}

		.runner-stage {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			align-items: center;
			gap: 1rem;
			min-width: 0;
			min-height: 0;
			padding: 1rem;
			overflow: hidden;
			background:
				radial-gradient(circle at 60% 38%, rgba(143, 92, 255, 0.13), transparent 26rem),
				#05040a;
		}

		.evolution-reference,
		.evolution-pane {
			display: grid;
			grid-template-rows: auto auto;
			justify-items: center;
			align-content: center;
			gap: 0.55rem;
			min-width: 0;
			min-height: 0;
		}

		.evolution-label {
			margin: 0;
			color: var(--muted);
			font-family: "Courier New", Courier, monospace;
			font-size: 0.68rem;
			font-weight: 700;
			letter-spacing: 0.1em;
			text-align: center;
			text-transform: uppercase;
		}

		.evolution-reference-frame,
		.evolution-canvas-frame {
			position: relative;
			display: grid;
			place-items: center;
			width: var(--evolution-frame-size);
			aspect-ratio: 1;
			overflow: hidden;
			border: 1px solid var(--line);
			border-radius: 0.85rem;
			background: #05040a;
		}

		#inspo-img {
			display: block !important;
			width: var(--evolution-image-size) !important;
			height: var(--evolution-image-size) !important;
			max-width: var(--evolution-image-size) !important;
			max-height: var(--evolution-image-size) !important;
			margin: auto !important;
			object-fit: contain;
			opacity: 1 !important;
		}

		#canvas-container,
		#active {
			position: absolute;
			inset: 0;
			display: grid;
			place-items: center;
			overflow: hidden;
		}

		#active canvas {
			position: absolute !important;
			left: 50% !important;
			top: 50% !important;
			display: block !important;
			margin: 0 !important;
			transform: translate(-50%, -50%) !important;
			transform-origin: center center !important;
		}

		#best {
			position: fixed !important;
			left: -10000px !important;
			top: -10000px !important;
			width: 1px !important;
			height: 1px !important;
			overflow: hidden !important;
			opacity: 0 !important;
			pointer-events: none !important;
		}

		.runner-panel {
			position: relative;
			z-index: 5;
			min-width: 0;
			height: 100vh;
			padding: 4.6rem 1rem 1rem;
			overflow: hidden;
			border-left: 1px solid var(--line);
			background: rgba(21, 19, 27, 0.98);
		}

		.runner-panel-inner {
			display: flex;
			flex-direction: column;
			gap: 0.75rem;
			height: 100%;
			min-height: 0;
		}

		.runner-label {
			margin: 0;
			color: var(--lime);
			font-family: "Courier New", Courier, monospace;
			font-size: 0.68rem;
			font-weight: 700;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		.runner-control-group {
			display: grid;
			gap: 0.45rem;
		}

		.runner-control-group label {
			margin: 0;
			color: var(--muted);
			font-size: 0.76rem;
			line-height: 1.35;
		}

		.runner-control-inline {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 0.75rem;
			color: var(--muted);
			font-size: 0.76rem;
		}

		.runner-stats {
			display: grid;
			grid-template-columns: 1fr auto;
			gap: 0.3rem 0.65rem;
			padding: 0.65rem 0.75rem;
			border: 1px solid var(--line);
			border-radius: 0.75rem;
			color: var(--muted);
			background: rgba(255, 255, 255, 0.025);
			font-size: 0.72rem;
		}

		.runner-stats strong {
			color: var(--text);
			font-weight: 600;
		}

		.runner-memory {
			display: flex;
			flex: 1;
			min-height: 0;
			flex-direction: column;
			gap: 0.45rem;
		}

		.runner-memory-label {
			display: flex;
			align-items: baseline;
			justify-content: space-between;
			gap: 0.5rem;
		}

		.runner-memory-label small {
			color: var(--muted);
			font-size: 0.62rem;
		}

		#memory {
			position: static;
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			grid-template-rows: repeat(4, minmax(0, 1fr));
			flex: 1;
			min-height: 0;
			margin: 0;
			gap: 0.35rem;
			overflow: hidden;
		}

		#memory img.memory {
			display: block;
			width: 100% !important;
			height: 100% !important;
			min-width: 0;
			min-height: 0;
			border: 1px solid var(--line);
			border-radius: 0.45rem;
			background: var(--background);
			object-fit: contain;
		}

		@media screen and (max-width: 900px) {
			.runner-stage {
				gap: 0.6rem;
				padding: 0.6rem;
			}
		}

		@media screen and (max-width: 760px) {
			.runner-shell {
				grid-template-columns: 1fr;
				grid-template-rows: minmax(0, 1fr) auto;
			}

			.runner-stage {
				grid-template-columns: repeat(2, minmax(0, 1fr));
			}

			.evolution-label {
				font-size: 0.58rem;
			}

			.runner-panel {
				width: 100%;
				height: auto;
				max-height: 38vh;
				padding: 0.8rem;
				border-top: 1px solid var(--line);
				border-left: 0;
			}

			.runner-panel-inner {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				align-items: start;
				gap: 0.6rem;
			}
		}
	</style>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/p5.js" defer></script>
	<script src="../js/site.js" defer></script>
	<script src="./js/project.js" defer></script>
	<script src="./js/my_design.js" defer></script>
	<script src="./js/sketch.js" defer></script>

	<script>
		(() => {
			const fitCanvas = () => {
				const canvas = document.querySelector("#active canvas");

				if (!canvas) {
					return;
				}

				canvas.style.width = `${Number(canvas.width) || 1}px`;
				canvas.style.height = `${Number(canvas.height) || 1}px`;
			};

			const observer = new MutationObserver(fitCanvas);

			window.addEventListener("DOMContentLoaded", () => {
				observer.observe(document.body, {
					childList: true,
					subtree: true
				});

				fitCanvas();
			});

			window.addEventListener("load", fitCanvas);
			window.addEventListener("resize", fitCanvas);
		})();
	</script>
</head>

<body>
	<div class="runner-shell">
		<div class="runner-stage">
			<div class="evolution-reference">
				<p class="evolution-label">reference</p>
				<div class="evolution-reference-frame">
					<img id="inspo-img" alt="Reference image" />
				</div>
			</div>

			<div class="evolution-pane">
				<p class="evolution-label">evolution</p>
				<div class="evolution-canvas-frame">
					<div id="canvas-container">
						<div id="active"></div>
						<div id="best"></div>
					</div>
				</div>
			</div>
		</div>

		<aside class="runner-panel">
			<div class="runner-panel-inner">
				<p class="runner-label">controls</p>

				<div class="runner-control-group">
					<label for="dropper">inspiration image</label>
					<select id="dropper"></select>
				</div>

				<button id="restart">restart evolution</button>

				<label class="runner-control-inline" for="toggle">
					<span>auto-update</span>
					<input id="toggle" type="checkbox" checked />
				</label>

				<div class="runner-control-group">
					<label for="slider">mutation rate <strong><span id="rate"></span>%</strong></label>
					<input id="slider" type="range" min="1" max="100" value="1" />
				</div>

				<div class="runner-stats">
					<span>active score</span>
					<strong id="activeScore"></strong>
					<span>best score</span>
					<strong id="bestScore"></strong>
					<span>exploration</span>
					<strong><span id="fpsCounter"></span> fps</strong>
				</div>

				<div class="runner-memory">
					<div class="runner-memory-label">
						<p class="runner-label">closest matches</p>
						<small>best 16 so far</small>
					</div>
					<p id="memory" data-max-items="16"></p>
				</div>
			</div>
		</aside>
	</div>
</body>
</html>
